name: USDT 5h Report

on:
  schedule:
    # هر ۵ ساعت: ۰۰:۰۰، ۰۵:۰۰، ۱۰:۰۰، ۱۵:۰۰، ۲۰:۰۰ UTC (۰۳:۳۰، ۰۸:۳۰، … به وقت تهران)
    - cron: '0 */5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: usdt-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Bybit balance & send Telegram report
        env:
          BYBIT_KEY: ${{ secrets.BYBIT_DEMO_KEY }}
          BYBIT_SECRET: ${{ secrets.BYBIT_DEMO_SECRET }}
          TG_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT_ID }}
        run: python usdt-report/report.py

      - name: Persist equity history
        run: |
          git config user.name "man51too"
          git config user.email "183092886+man51too@users.noreply.github.com"
          git pull --rebase -q origin main || true
          git add usdt-report/history.json
          if git diff --cached --quiet; then
            echo "no history change"
          else
            git commit -q -m "USDT history auto-update [skip ci]"
            for i in 1 2 3; do
              git push -q origin main && break || (sleep 10; git pull --rebase -q origin main || true)
            done
          fi
